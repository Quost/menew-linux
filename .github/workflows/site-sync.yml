name: Site sync

# The /linux page of https://menew.pururucos.com.br is built in the Mac repo (Quost/menew) from site/ and docs/assets/ here.
# This workflow tells that repo to rebuild and deploy the site when a release is published or that content changes.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ["site/**", "docs/assets/**"]

permissions:
  contents: read

concurrency:
  group: site-sync
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the Mac repo to rebuild the site
        env:
          TOKEN: ${{ secrets.MENEW_SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::MENEW_SITE_DISPATCH_TOKEN is not set, so the site was not asked to rebuild. The next push to main in Quost/menew (or a manual run of its Site workflow) picks up this content. See site/README.md."
            exit 0
          fi
          status=$(curl -sS -o /tmp/dispatch.out -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Quost/menew/dispatches \
            -d '{"event_type":"menew-linux-site"}') || status=000
          if [ "$status" = "204" ]; then
            echo "Site rebuild requested (HTTP 204)."
          else
            echo "::warning::The site rebuild request failed (HTTP $status). Check that the token can write to Quost/menew."
            cat /tmp/dispatch.out 2>/dev/null || true
          fi
