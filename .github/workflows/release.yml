name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libdbus-1-dev pkg-config build-essential \
            desktop-file-utils appstream file patchelf squashfs-tools

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the crate version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Validate desktop file and metainfo
        run: |
          desktop-file-validate data/app.menew.Menew.desktop
          appstreamcli validate --no-net data/app.menew.Menew.metainfo.xml

      - run: cargo build --release -p menew

      - name: Build the .deb
        run: |
          cargo install cargo-deb --locked
          mkdir -p dist
          cargo deb -p menew --no-build --output dist/
          # `~` in the Debian version is not a safe file name on GitHub; use the plain version.
          mv dist/menew_*_amd64.deb "dist/menew_${VERSION}_amd64.deb"

      - name: Build the AppImage
        run: bash scripts/build-appimage.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum "menew_${VERSION}_amd64.deb" "Menew-${VERSION}-x86_64.AppImage" | tee SHA256SUMS

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${VERSION}" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "no CHANGELOG.md section for ${VERSION}" >&2
            exit 1
          fi

      # The feed of the in-app updater (docs/updates-spec.md): update.json with the notes and, for each
      # artifact, the URL, size, SHA-256 and an Ed25519 signature. Without the key the release is NOT published.
      - name: Sign the artifacts and write update.json
        env:
          MENEW_UPDATE_SIGNING_KEY: ${{ secrets.MENEW_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "${MENEW_UPDATE_SIGNING_KEY}" ]; then
            echo "the MENEW_UPDATE_SIGNING_KEY secret is missing: refusing to publish an unsigned release" >&2
            exit 1
          fi
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "${MENEW_UPDATE_SIGNING_KEY}" > "$key"
          # the key must be the one compiled into the app, or no installed copy could verify the update
          derived="$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | base64 -w0)"
          embedded="$(sed -n 's/.*UPDATE_PUBLIC_KEY: &str = "\([^"]*\)".*/\1/p' crates/menew-core/src/updates.rs)"
          if [ "${derived}" != "${embedded}" ]; then
            echo "the signing key (${derived}) is not UPDATE_PUBLIC_KEY of crates/menew-core/src/updates.rs (${embedded})" >&2
            exit 1
          fi
          bash scripts/make-update-json.sh "${VERSION}" dist "$key" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" dist/RELEASE_NOTES.md
          cat dist/update.json

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          case "${GITHUB_REF_NAME}" in
            *-alpha*|*-beta*|*-rc*) flags+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "Menew ${VERSION}" \
            --notes-file dist/RELEASE_NOTES.md \
            "${flags[@]}" \
            "dist/menew_${VERSION}_amd64.deb" \
            "dist/Menew-${VERSION}-x86_64.AppImage" \
            dist/SHA256SUMS \
            dist/update.json
