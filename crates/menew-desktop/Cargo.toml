[package]
name = "menew-desktop"
version.workspace = true
edition = "2021"
description = "Desktop integration for Menew Linux: screenshot and color picker portals, window snapping (KWin scripting, GNOME extension)"
license = "GPL-3.0-only"

[dependencies]
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio", "tracing"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1.0", features = ["full"] }
