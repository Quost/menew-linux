[package]
name = "menew"
version.workspace = true
edition = "2021"
description = "Menew for Linux: native, private productivity utility"
license = "GPL-3.0-only"

[dependencies]
menew-core = { path = "../menew-core" }
menew-tray = { path = "../menew-tray" }
menew-shortcuts = { path = "../menew-shortcuts" }
menew-clipboard = { path = "../menew-clipboard" }
menew-ui = { path = "../menew-ui" }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
libadwaita = { version = "0.7", package = "libadwaita", features = ["v1_2"] }
gtk4 = { version = "0.9", package = "gtk4" }
zbus = { version = "5", default-features = false, features = ["tokio"] }
ashpd = { version = "0.10", default-features = false, features = ["tokio", "tracing"] }

[package.metadata.deb]
name = "menew"
maintainer = "Matheus Quost <Quost@users.noreply.github.com>"
copyright = "2026, Matheus Quost"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """\
Private, native command palette, clipboard history and notes for GNOME and KDE Plasma on Wayland.
The GNOME Shell clipboard extension is installed but not enabled; enable it yourself."""
depends = "$auto, curl"
recommends = "wl-clipboard, fonts-noto-color-emoji, tesseract-ocr, tesseract-ocr-eng, gnome-keyring | kwalletmanager, polkitd, xdg-desktop-portal"
assets = [
    ["target/release/menew", "usr/bin/menew", "755"],
    ["../../data/app.menew.Menew.desktop", "usr/share/applications/app.menew.Menew.desktop", "644"],
    ["../../data/app.menew.Menew.metainfo.xml", "usr/share/metainfo/app.menew.Menew.metainfo.xml", "644"],
    ["../../data/app.menew.Menew.policy", "usr/share/polkit-1/actions/app.menew.Menew.policy", "644"],
    ["../../data/icons/hicolor/scalable/apps/menew.svg", "usr/share/icons/hicolor/scalable/apps/menew.svg", "644"],
    ["../../data/icons/hicolor/scalable/apps/menew-symbolic.svg", "usr/share/icons/hicolor/scalable/apps/menew-symbolic.svg", "644"],
    ["../../gnome-extension/metadata.json", "usr/share/gnome-shell/extensions/menew-bridge@menew.web.app/metadata.json", "644"],
    ["../../gnome-extension/extension.js", "usr/share/gnome-shell/extensions/menew-bridge@menew.web.app/extension.js", "644"],
    ["../../README.md", "usr/share/doc/menew/README.md", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/menew/CHANGELOG.md", "644"],
]
