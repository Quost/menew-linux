[package]
name = "menew-ui"
version.workspace = true
edition = "2021"
description = "GTK4 / Libadwaita user interface and command palette for Menew Linux"
license = "GPL-3.0-only"

[dependencies]
menew-core = { path = "../menew-core" }
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.9", package = "gtk4" }
libadwaita = { version = "0.7", package = "libadwaita", features = ["v1_2"] }
