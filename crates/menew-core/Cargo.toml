[package]
name = "menew-core"
version = "0.1.0"
edition = "2021"
description = "Core logic, desktop app scanning, database and i18n for Menew Linux"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5.0"
walkdir = "2.4"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.10"
