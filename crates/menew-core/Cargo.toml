[package]
name = "menew-core"
version.workspace = true
edition = "2021"
description = "Core logic, desktop app scanning, database and i18n for Menew Linux"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.43", features = ["bundled"] }
dirs = "5.0"
walkdir = "2.4"
chrono = { version = "0.4", features = ["serde"] }
# Ed25519 verification of the update artifacts: MIT, no dependencies, no unsafe in the verify path
ed25519-compact = { version = "2.6", default-features = false, features = ["std"] }
rqrr = { version = "0.11", default-features = false }
qrcodegen = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
