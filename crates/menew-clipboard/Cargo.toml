[package]
name = "menew-clipboard"
version = "0.1.0"
edition = "2021"
description = "Clipboard listener (KDE data-control + GNOME D-Bus bridge) with SQLite history"
license = "MIT"

[dependencies]
menew-core = { path = "../menew-core" }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
